services:
  dax-stoxx-spreads:
    build: .
    image: dax-stoxx-spreads:2.2.0
    container_name: dax-stoxx-spreads
    restart: unless-stopped
    env_file:
      - .env
    # Estándar del host: loopback + puerto fijo. No se publica en 0.0.0.0,
    # así que no hace falta abrir ufw y cloudflared llega por 127.0.0.1.
    ports:
      - "127.0.0.1:8001:8000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
