target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Los prompts del motor son cadenas largas por diseño.
ignore = ["E501"]

[lint.per-file-ignores]
"tests/*" = ["B011"]
# FastAPI exige la llamada Query(...) como valor por defecto; no es un bug.
"api.py" = ["B008"]
